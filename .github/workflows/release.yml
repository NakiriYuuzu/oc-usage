name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    id-token: write

jobs:
    release:
        name: Build & Publish
        runs-on: ubuntu-latest
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node.js (for npm publish)
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Verify build
              run: |
                  test -f dist/index.js
                  echo "Build size: $(du -h dist/index.js | cut -f1)"

            - name: Extract version from tag
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Update package.json version
              run: |
                  bun -e "
                  const pkg = await Bun.file('package.json').json();
                  pkg.version = '${{ steps.version.outputs.VERSION }}';
                  await Bun.write('package.json', JSON.stringify(pkg, null, 4));
                  "

            - name: Debug token presence
              run: |
                  if [ -n "$NODE_AUTH_TOKEN" ]; then
                    echo "✅ NODE_AUTH_TOKEN is set (length: ${#NODE_AUTH_TOKEN})"
                  else
                    echo "❌ NODE_AUTH_TOKEN is empty or not set"
                    exit 1
                  fi

            - name: Publish to npm
              run: npm publish --provenance --access public

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      dist/index.js
